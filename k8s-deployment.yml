apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-crud-grpc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-crud-grpc
  template:
    metadata:
      labels:
        app: student-crud-grpc
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: student-crud-grpc
          image: student-crud-grpc:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
              name: grpc
            - containerPort: 8080
              name: management
            - containerPort: 8083
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/postgres?currentSchema=grpc
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: password
            - name: SERVER_PORT
              value: "8083"
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 20
